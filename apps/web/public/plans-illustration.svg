  <ellipse cx="260" cy="188" rx="235" ry="34" fill="#cde9cb"/>
  <!-- back leaves -->
  <ellipse cx="140" cy="118" rx="58" ry="24" fill="#2f8f5b" transform="rotate(-22 140 118)"/>
  <ellipse cx="382" cy="112" rx="58" ry="24" fill="#2f8f5b" transform="rotate(20 382 112)"/>
  <ellipse cx="168" cy="82" rx="34" ry="14" fill="#3aa267" transform="rotate(-30 168 82)"/>
  <ellipse cx="352" cy="76" rx="34" ry="14" fill="#3aa267" transform="rotate(28 352 76)"/>
  <!-- book: bottom (green) -->
  <rect x="168" y="140" width="184" height="28" rx="9" fill="#0e6a45"/>
  <rect x="176" y="147" width="168" height="15" rx="5" fill="#ffffff"/>
  <!-- book: middle (yellow) -->
  <rect x="184" y="114" width="152" height="26" rx="9" fill="#f6b73c"/>
  <rect x="192" y="120" width="136" height="14" rx="5" fill="#ffffff"/>
