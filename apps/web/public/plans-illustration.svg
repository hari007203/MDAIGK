  <!-- sparkle -->
  <path d="M410 42 L413 50 L421 53 L413 56 L410 64 L407 56 L399 53 L407 50 Z" fill="#f6b73c"/>
  <circle cx="112" cy="52" r="5" fill="#3aa267"/>
